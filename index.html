<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>FORM — Fuel Your Transformation</title>
    <meta
      name="description"
      content="FORM is a personalized fitness and nutrition planning tool. Get a transparent calorie target, a seven-day meal plan built from real foods, a costed grocery list and a progress dashboard. Free, open source, and runs entirely in your browser."
    />
    <meta name="theme-color" content="#0B0D0C" />

    <!-- Open Graph -->
    <meta property="og:title" content="FORM — Fuel Your Transformation" />
    <meta
      property="og:description"
      content="Personalized nutrition for your fitness journey. Transparent calculations, real meal plans, honest limits."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Fonts: Archivo (variable, used condensed for display), Inter (UI),
      JetBrains Mono (data & chrome). Preconnect so the first paint is not
      blocked; system fallbacks keep the page readable if fonts never load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f5f0; background: #0b0d0c">
        <h1>FORM needs JavaScript</h1>
        <p>
          FORM is an interactive nutrition planning tool that runs entirely in your browser. Please
          enable JavaScript to use it.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
